[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "nodi-foundation"
version = "0.1.0"
description = "Standalone analytical simulation and immutable datasets for NODI research."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.2,<3",
  "pyarrow>=25,<26",
  "PyYAML>=6.0.2,<7",
  "scipy>=1.15,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.11,<1",
]

[project.scripts]
nodi-foundation = "nodi_foundation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nodi_foundation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

